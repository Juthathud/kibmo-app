services:
  - type: web
    name: kibmoo-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CRON_SECRET
        sync: false

  - type: web
    name: kibmoo-frontend
    env: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://kibmoo-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Runs once a day at 02:00 UTC (09:00 Bangkok time) to send day-before SMS
  # reminders for jobs happening tomorrow. Set CRON_SECRET to the same value
  # as kibmoo-backend's (Render dashboard -> both services -> Environment)
  # so this job is the only thing allowed to trigger the endpoint.
  - type: cron
    name: kibmoo-notify-reminders
    env: python
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/cron_notify.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        value: https://kibmoo-backend.onrender.com
      - key: CRON_SECRET
        sync: false
